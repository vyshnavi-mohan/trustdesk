services:
  postgres:
    image: postgres:17
    container_name: trustdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustdesk
      POSTGRES_USER: trustdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustdesk_dev}
    ports:
      - "5432:5432"
    volumes:
      - trustdesk-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustdesk -d trustdesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  trustdesk-postgres-data:
