spring:
  application:
    name: trustdesk-api

  datasource:
    url: jdbc:postgresql://localhost:5432/trustdesk
    username: trustdesk
    password: ${DB_PASSWORD:trustdesk_dev}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8080

trustdesk:
  data:
    directory: ../data
